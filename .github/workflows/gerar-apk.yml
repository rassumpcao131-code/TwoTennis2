name: Gerar APK do TwoTennis2

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  gerar-apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Encontrar pasta do projeto
        id: projeto
        shell: bash
        run: |
          WRAPPER="$(find . -name gradlew -type f | head -n 1)"

          if [ -z "$WRAPPER" ]; then
            echo "ERRO: arquivo gradlew não encontrado."
            exit 1
          fi

          DIRETORIO="$(dirname "$WRAPPER")"
          echo "dir=$DIRETORIO" >> "$GITHUB_OUTPUT"
          echo "Projeto encontrado em: $DIRETORIO"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Liberar Gradle
        working-directory: ${{ steps.projeto.outputs.dir }}
        run: chmod +x gradlew

      - name: Compilar APK
        working-directory: ${{ steps.projeto.outputs.dir }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: TwoTennis2-APK
          path: ${{ steps.projeto.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
